{% extends "admin/base.html" %}

{% block content %}
<h1>站点设置</h1>

<form method="post" action="/admin/settings">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-group">
        <label>站点标题</label>
        <input type="text" name="site_title" value="{{ site_settings.get('site_title', '') }}">
    </div>

    <div class="form-group">
        <label>站点副标题</label>
        <input type="text" name="site_subtitle" value="{{ site_settings.get('site_subtitle', '') }}">
    </div>

    <div class="form-group">
        <label>站点描述</label>
        <textarea name="site_description" rows="3">{{ site_settings.get('site_description', '') }}</textarea>
    </div>

    <div class="form-group">
        <label>头像 URL</label>
        <div class="upload-row">
            <input type="text" id="site-avatar-input" name="site_avatar" value="{{ site_settings.get('site_avatar', '') }}">
            <label class="btn upload-btn">
                上传头像
                <input type="file" id="site-avatar-file" accept="image/*">
            </label>
        </div>
        <div class="upload-hint">支持 jpg、jpeg、png、gif、webp，最大 5MB。</div>
        <img id="site-avatar-preview" class="avatar-preview" src="{{ site_settings.get('site_avatar', '') }}" alt="头像预览">
    </div>

    <div class="form-group">
        <label>GitHub 链接</label>
        <input type="text" name="github_url" value="{{ site_settings.get('github_url', '') }}">
    </div>

    <div class="form-group">
        <label>关于页面内容（Markdown）</label>
        <div class="editor-split plain-editor-split">
            <div class="editor-pane">
                <textarea id="about-content-editor" name="about_content" rows="16">{{ site_settings.get('about_content', '') }}</textarea>
            </div>
            <div class="preview-pane">
                <div class="preview-pane-title">预览</div>
                <div id="about-content-preview" class="post-content editor-preview-content"></div>
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">保存设置</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="/static/js/editor.js"></script>
<script>
const csrfToken = '{{ csrf_token }}';
initImageUrlUpload('site-avatar-file', 'site-avatar-input', 'site-avatar-preview', csrfToken);
initTextareaPreview('about-content-editor', 'about-content-preview');
</script>
{% endblock %}
