{% extends "admin/base.html" %}

{% block content %}
<h1>标签管理</h1>

<form method="post" action="/admin/tags" class="inline-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="text" name="name" placeholder="标签名称" required>
    <button type="submit" class="btn btn-primary">添加</button>
</form>

<table class="admin-table">
    <thead>
        <tr>
            <th>名称</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for tag in tags %}
        <tr>
            <td>{{ tag.name }}</td>
            <td>
                <form method="post" action="/admin/tag/{{ tag.id }}/delete" style="display:inline;" onsubmit="return confirm('确定删除？')">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit" class="btn btn-sm btn-danger">删除</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="2" class="empty">暂无标签</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
