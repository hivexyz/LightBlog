<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pygments-css@1.0.0/github.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="site-title">{{ site.title }}</a>
            <p class="site-subtitle">{{ site.subtitle }}</p>
            <nav class="site-nav">
                <a href="/">首页</a>
                <a href="/archive">归档</a>
                <a href="/about">关于</a>
                <a href="/admin/">管理</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div class="content-wrapper">
            <div class="content-main">
                {% block content %}{% endblock %}
            </div>
            <aside class="content-sidebar">
                <div class="widget">
                    <h3>分类</h3>
                    <ul>
                        {% for cat in categories %}
                        <li><a href="/category/{{ cat.slug }}">{{ cat.name }}</a></li>
                        {% endfor %}
                    </ul>
                </div>
                <div class="widget">
                    <h3>标签</h3>
                    <div class="tag-cloud">
                        {% for tag in tags %}
                        <a href="/tag/{{ tag.slug }}" class="tag">{{ tag.name }}</a>
                        {% endfor %}
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 {{ site.title }}. Powered by LightBlog</p>
        </div>
    </footer>

    <!-- KaTeX 数学公式渲染 -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [{left: '\\\\(', right: '\\\\)', display: false}, {left: '\\\\[', right: '\\\\]', display: true}]});"></script>
</body>
</html>
