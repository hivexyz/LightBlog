services:
  web:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - SECRET_KEY=change-me-in-production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change-me
      - COOKIE_SECURE=false
      - DATABASE_URL=sqlite:///./data/blog.db
      # AI 共创：配置 OpenAI-compatible 服务后启用。密钥建议放在 .env，不要直接提交。
      - AI_API_BASE=${AI_API_BASE:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_TEXT_MODEL=${AI_TEXT_MODEL:-}
      - AI_IMAGE_MODEL=${AI_IMAGE_MODEL:-}
      - AI_REQUEST_TIMEOUT=${AI_REQUEST_TIMEOUT:-180}
      - AI_FINAL_MAX_TOKENS=${AI_FINAL_MAX_TOKENS:-4800}
      - AI_IMAGE_PLAN_MAX_TOKENS=${AI_IMAGE_PLAN_MAX_TOKENS:-1800}
      - AI_HUMANIZE_MAX_TOKENS=${AI_HUMANIZE_MAX_TOKENS:-4800}
      - AI_JOB_WORKER_ENABLED=${AI_JOB_WORKER_ENABLED:-true}
      - AI_JOB_POLL_INTERVAL=${AI_JOB_POLL_INTERVAL:-1}
      - AI_JOB_STALE_SECONDS=${AI_JOB_STALE_SECONDS:-600}
      - AI_JOB_MAX_ATTEMPTS=${AI_JOB_MAX_ATTEMPTS:-2}
      - AI_MAX_INLINE_IMAGES=${AI_MAX_INLINE_IMAGES:-2}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-}
      - WEB_SEARCH_API_BASE=${WEB_SEARCH_API_BASE:-}
      - WEB_SEARCH_API_KEY=${WEB_SEARCH_API_KEY:-}
      - WEB_SEARCH_MAX_QUERIES=${WEB_SEARCH_MAX_QUERIES:-3}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-5}
      - WEB_SEARCH_TIMEOUT=${WEB_SEARCH_TIMEOUT:-30}
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - web
    restart: always
